<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definições</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.8 3.6-5.5 7-5.5s6.2 1.7 7 5.5"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20 12v2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2-.6-1.2.2-2.5 1.6-2.5H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0 4.8 5.2L12 19l-3-3 7.3-7.3z"/></symbol>
  <symbol id="i-k" viewBox="0 0 32 32"><path d="M9 6v20M9 16l12-10M12.5 14l9.5 12"/></symbol>
  <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
  <symbol id="i-cookie" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><circle cx="8.5" cy="8.5" r=".5" fill="currentColor"/><circle cx="12" cy="16" r=".5" fill="currentColor"/><circle cx="16" cy="12" r=".5" fill="currentColor"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</defs></svg>

<header class="settings-header">
  <div class="settings-header__brand">
    <svg class="icon k-logo"><use href="#i-k"/></svg>
    <h1>Definições</h1>
  </div>
</header>

<div class="settings-body">
  <nav id="settings-nav" class="settings-nav"></nav>
  <main id="settings-content" class="settings-content">
    <div id="settings-column" class="settings-column"></div>
    <div id="profile-column" class="settings-column" style="display: none;"></div>
  </main>
</div>

<script src="settings.js"></script>
<!-- KORTEX EXTRA IMPORTS -->
<div style="margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
  <h3 style="margin-top: 0; color: #ff5722; font-size: 16px;">Pesquisa e Importação</h3>
  
  <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: #ccc; font-size: 14px;">Motor de Pesquisa Predefinido</label>
    <select id="searchEngineSelect" style="padding: 10px; border-radius: 6px; background: #1e1e1e; color: white; border: 1px solid #444; width: 100%; font-size: 14px; cursor: pointer;">
      <option value="google">Google</option>
      <option value="bing">Bing</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="yahoo">Yahoo</option>
    </select>
  </div>

  <div style="display: flex; gap: 10px; margin-top: 20px;">
    <button id="importBookmarksBtn" style="padding: 12px 15px; background: #ff5722; color: white; border: none; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; font-size: 14px;">Importar Favoritos (HTML)</button>
    <button id="importPasswordsBtn" style="padding: 12px 15px; background: #ff5722; color: white; border: none; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; font-size: 14px;">Importar Palavras-passe (CSV)</button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const bridge = window.kortex || window.api || window.electronAPI;
    if (!bridge) return console.log('Bridge nao encontrada');

    const sel = document.getElementById('searchEngineSelect');
    if (sel) {
      try { sel.value = (await bridge.invoke('settings:get', 'search.engine')) || 'google'; } catch(e){}
      sel.addEventListener('change', () => bridge.invoke('settings:set', 'search.engine', sel.value));
    }

    const btnB = document.getElementById('importBookmarksBtn');
    if (btnB) btnB.addEventListener('click', async () => {
      const r = await bridge.invoke('import:bookmarks');
      if (r && r.success) alert('Sucesso! Importados ' + r.imported + ' favoritos.');
    });

    const btnP = document.getElementById('importPasswordsBtn');
    if (btnP) btnP.addEventListener('click', async () => {
      const r = await bridge.invoke('import:passwords');
      if (r && r.success) alert('Sucesso! Importadas ' + r.imported + ' palavras-passe.');
    });
  });
</script>
<br><br>
<div id="kortex-ai-settings" style="padding: 20px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
  <h3 style="margin-top: 0; color: #ff5722; font-size: 16px;">Assistente IA (Companheiros)</h3>
  <p style="font-size: 13px; color: #888; margin-bottom: 15px;">Configura a chave e o modelo usados pelos agentes e pelo chat do Kortex.</p>

  <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: #ccc; font-size: 14px;">Chave da API (API Key)</label>
    <input type="password" id="aiApiKey" placeholder="sk-..." style="padding: 10px; border-radius: 6px; background: #1e1e1e; color: white; border: 1px solid #444; width: 100%; font-size: 14px; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 15px;">
    <label style="display: block; margin-bottom: 8px; color: #ccc; font-size: 14px;">Modelo</label>
    <input type="text" id="aiModel" placeholder="Ex: deepseek-chat ou google/gemini-3.8-flash" style="padding: 10px; border-radius: 6px; background: #1e1e1e; color: white; border: 1px solid #444; width: 100%; font-size: 14px; box-sizing: border-box;">
  </div>

  <button id="saveAiBtn" style="padding: 12px 15px; background: #ff5722; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">Guardar Definições de IA</button>
  <span id="aiSaveStatus" style="margin-left: 15px; font-size: 13px; color: #4caf50; display: none;">Guardado com sucesso!</span>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!window.kortexSettings) return;
    
    const keyInput = document.getElementById('aiApiKey');
    const modelInput = document.getElementById('aiModel');
    const saveBtn = document.getElementById('saveAiBtn');
    const statusMsg = document.getElementById('aiSaveStatus');

    // Carregar valores atuais
    try {
      keyInput.value = (await window.kortexSettings.get('ai.apiKey')) || '';
      modelInput.value = (await window.kortexSettings.get('ai.model')) || '';
    } catch(e) {}

    saveBtn.addEventListener('click', async () => {
      saveBtn.innerText = 'A guardar...';
      try {
        await window.kortexSettings.set('ai.apiKey', keyInput.value.trim());
        await window.kortexSettings.set('ai.model', modelInput.value.trim());
        statusMsg.style.display = 'inline';
        setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
      } catch(e) {
        alert('Erro ao guardar: ' + e.message);
      }
      saveBtn.innerText = 'Guardar Definições de IA';
    });
  });
</script>
</body>
</html>
