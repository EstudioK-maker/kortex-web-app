<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Permissões dos sites</title>
<style>
:root { --bg:#1a1b1d; --surface:#232427; --hover:#2b2c30; --border:#2c2d31; --text:#ececee; --muted:#9a9aa2; --accent:#ff5722; --danger:#ff6b62; --ok:#4ade80; }
@media (prefers-color-scheme: light) { :root { --bg:#fff; --surface:#f3f4f6; --hover:#e7e9ed; --border:#dcdee3; --text:#1b1c1f; --muted:#5b5d66; --ok:#15803d; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 14px; }
header { display: flex; align-items: center; gap: 16px; padding: 16px 28px; border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; font-weight: 600; }
header p { color: var(--muted); font-size: 13px; flex: 1; }
button { border-radius: 6px; padding: 6px 12px; color: var(--muted); background: transparent; border: 1px solid var(--border); cursor: pointer; font-size: 12px; }
button:hover { background: var(--hover); color: var(--text); }
#clear { color: var(--danger); border-color: rgba(255,107,98,.4); height: 34px; padding: 0 14px; font-size: 13px; }
main { flex: 1; overflow-y: auto; padding: 8px 28px 40px; }
.site { margin: 22px 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; }
.row:hover { background: var(--surface); }
.label { flex: 1; }
.state { font-size: 12px; font-weight: 600; }
.state.allow { color: var(--ok); }
.state.block { color: var(--danger); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Permissões dos sites</h1>
  <p>Escolhas guardadas quando um site pediu acesso à câmara, ao microfone, à localização ou às notificações. Remover uma escolha faz o Kortex voltar a perguntar.</p>
  <button id="clear">Remover todas</button>
</header>
<main id="list"></main>
<script src="permissions.js"></script>
</body>
</html>
