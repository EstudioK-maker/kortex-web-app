<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>AI Hub - Kortex</title>
  <style>
    :root { 
      --bg: #0f0f11; --surface: #1c1d21; --surface-hover: #232429;
      --border: #2d2e35; --text: #ffffff; --muted: #8f8f9b; --accent: #00a8ff; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 30px 40px; overflow-y: auto; height: 100vh; }
    
    .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; max-width: 1200px; }
    .title-area h1 { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
    .title-area p { color: var(--muted); font-size: 14px; max-width: 500px; line-height: 1.4; }
    
    .search-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 30px; max-width: 1200px; transition: 0.2s; }
    .search-bar:focus-within { border-color: var(--muted); }
    .search-bar svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
    .search-bar input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; font-family: inherit; }
    
    .filters { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; max-width: 1200px; position: relative; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.1); }
    
    .dropdown-container { position: relative; }
    .dropdown-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; min-width: 200px; justify-content: space-between; }
    .dropdown-btn:hover { background: rgba(255,255,255,0.05); }
    .dropdown-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    /* MENU DROPDOWN */
    .dropdown-menu { 
      position: absolute; top: calc(100% + 8px); right: 0; width: 250px; 
      background: #1a1b1d; border: 1px solid var(--border); border-radius: 10px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; flex-direction: column; 
      z-index: 1000; padding: 6px; 
    }
    .dropdown-menu.open { display: flex; }
    .dropdown-item { 
      padding: 10px 12px; border-radius: 6px; font-size: 13px; color: var(--text); 
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); }
    .dropdown-item svg.check { width: 16px; height: 16px; stroke: #00a8ff; fill: none; stroke-width: 2.5; display: none; }
    .dropdown-item.selected svg.check { display: block; }
    .dropdown-separator { height: 1px; background: var(--border); margin: 6px 0; }

    /* CATEGORIAS E CARTOES */
    .category { margin-bottom: 40px; max-width: 1200px; }
    .category-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .category-title { font-size: 18px; font-weight: 600; }
    .category-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; gap: 16px; position: relative; transition: 0.2s; }
    .card:hover { background: var(--surface-hover); border-color: #444; }
    .icon-box { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); }
    .icon-box svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    .card-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 30px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .btn-add { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: transparent; border: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-add svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .btn-add.installed { color: #00d2ff; }
    .btn-add.installed:hover { background: rgba(255, 107, 98, 0.1); color: #ff6b62; }
    
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; border-top-color: currentColor; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="title-area">
      <h1>Plugins & Skills</h1>
      <p>Adiciona superpoderes de programação, análise e produtividade ao Claude 3.5.</p>
    </div>
  </div>

  <div class="search-bar">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="Pesquisar plugins, skills e conectores">
  </div>

  <div class="filters">
    <div class="tabs">
      <button class="tab-btn active" data-tab="all">Plugins</button>
      <button class="tab-btn" data-tab="skill">Skills</button>
      <button class="tab-btn" data-tab="installed">Instalados</button>
    </div>
    
    <div class="dropdown-container">
      <button class="dropdown-btn" id="dropdown-trigger">
        <span id="current-category-text">Todas as categorias</span>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="dropdown-menu" id="dropdown-menu">
        <!-- Itens inseridos via JS -->
      </div>
    </div>
  </div>

  <div id="content-area"></div>

  <script>
    const CATEGORIES = [
      "Todas as categorias",
      "Produtividade e Colaboração",
      "Empresas em crescimento",
      "Construtores",
      "Marketing",
      "Comércio",
      "Investimentos e Mercados",
      "Finanças e Contabilidade"
    ];

    const ITEMS = [
      // --- CONSTRUTORES (FOCO EM PROGRAMAÇÃO) ---
      { id: 'code-reviewer', type: 'skill', category: 'Construtores', name: 'Revisor de Código', desc: 'Analisa o código que colares e sugere melhorias de performance e arquitetura.', icon: '<svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>' },
      { id: 'regex-wizard', type: 'skill', category: 'Construtores', name: 'Mestre de Regex', desc: 'Gera Expressões Regulares complexas com base na tua descrição.', icon: '<svg viewBox="0 0 24 24"><path d="M10 3v18M14 3v18M18 3v18M6 3v18"/></svg>' },
      { id: 'sql-expert', type: 'skill', category: 'Construtores', name: 'Especialista SQL', desc: 'Cria queries SQL complexas, otimiza índices e resolve JOINs.', icon: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>' },
      { id: 'docker-helper', type: 'plugin', category: 'Construtores', name: 'Docker Expert', desc: 'Ajuda a criar Dockerfiles, docker-compose e resolver problemas de containers.', icon: '<svg viewBox="0 0 24 24"><rect x="2" y="10" width="20" height="12" rx="2"/><path d="M6 10V6h4v4M10 10V6h4v4"/></svg>' },
      { id: 'git-assistant', type: 'plugin', category: 'Construtores', name: 'Git Assistant', desc: 'Resolve conflitos, sugere commits e explica comandos Git complexos.', icon: '<svg viewBox="0 0 24 24"><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>' },

      // --- PRODUTIVIDADE ---
      { id: 'summarize-page', type: 'skill', category: 'Produtividade e Colaboração', name: 'Resumir Página', desc: 'Cria um resumo conciso e direto do conteúdo da página que estás a visualizar.', icon: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>' },
      { id: 'extract-data', type: 'skill', category: 'Produtividade e Colaboração', name: 'Extrair Dados', desc: 'Lê a página e extrai tabelas ou listas para formato JSON/Texto.', icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>' },
      { id: 'translate-page', type: 'skill', category: 'Produtividade e Colaboração', name: 'Traduzir Página', desc: 'Traduz automaticamente o texto principal do site para o teu idioma.', icon: '<svg viewBox="0 0 24 24"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>' },
      { id: 'email-writer', type: 'skill', category: 'Produtividade e Colaboração', name: 'Redator de Emails', desc: 'Escreve emails profissionais e persuasivos a partir de tópicos simples.', icon: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>' },

      // --- EMPRESAS EM CRESCIMENTO ---
      { id: 'competitor-analysis', type: 'skill', category: 'Empresas em crescimento', name: 'Análise de Concorrência', desc: 'A IA analisa o site atual e extrai pontos fortes e fracos do concorrente.', icon: '<svg viewBox="0 0 24 24"><path d="M21 21H3V3M21 21V10l-5-5-5 5-5-5"/></svg>' },
      { id: 'swot-analyzer', type: 'skill', category: 'Empresas em crescimento', name: 'Matriz SWOT', desc: 'Gera uma análise SWOT (Forças, Fraquezas, Oportunidades, Ameaças) do negócio.', icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>' },

      // --- MARKETING ---
      { id: 'seo-analyzer', type: 'skill', category: 'Marketing', name: 'Analisador SEO', desc: 'Verifica meta tags, títulos, H1s e estrutura da página para otimização.', icon: '<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>' },
      { id: 'copywriter', type: 'skill', category: 'Marketing', name: 'Copywriter Pro', desc: 'Gera textos de vendas, anúncios e posts para redes sociais altamente persuasivos.', icon: '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' },

      // --- COMÉRCIO ---
      { id: 'price-extractor', type: 'skill', category: 'Comércio', name: 'Extrator de Preços', desc: 'Lê a página de e-commerce atual e extrai os produtos, preços e descontos.', icon: '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>' },
      { id: 'review-analyzer', type: 'skill', category: 'Comércio', name: 'Analisador de Reviews', desc: 'Resume os comentários de um produto e identifica o sentimento dos clientes.', icon: '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' },

      // --- INVESTIMENTOS E MERCADOS ---
      { id: 'stock-analyst', type: 'skill', category: 'Investimentos e Mercados', name: 'Analista de Ações', desc: 'Faz análise fundamentalista e técnica de tickers (ex: AAPL, PETR4).', icon: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18M18 9l-5 5-4-4-3 3"/></svg>' },
      { id: 'crypto-tracker', type: 'plugin', category: 'Investimentos e Mercados', name: 'Crypto Tracker', desc: 'Permite à IA consultar preços de criptomoedas em tempo real.', icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9a3 3 0 0 0-3-3h-2a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-2a3 3 0 0 1-3-3"/></svg>' },

      // --- FINANÇAS ---
      { id: 'tax-helper', type: 'skill', category: 'Finanças e Contabilidade', name: 'Assistente Fiscal', desc: 'Ajuda a calcular impostos, IVA e a entender legislação fiscal.', icon: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 10h8M8 14h8M8 18h4"/></svg>' },
      { id: 'invoice-parser', type: 'skill', category: 'Finanças e Contabilidade', name: 'Leitor de Faturas', desc: 'Extrai valores, datas e impostos de faturas abertas no navegador.', icon: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' }
    ];

    let enabledItems = {};
    let currentTab = 'all';
    let currentCategory = 'Todas as categorias';

    async function init() {
      if (window.kortex && window.kortex.plugins) {
        enabledItems = await window.kortex.plugins.get() || {};
      }
      setupDropdown();
      setupEvents();
      render();
    }

    function setupDropdown() {
      const trigger = document.getElementById('dropdown-trigger');
      const menu = document.getElementById('dropdown-menu');
      const text = document.getElementById('current-category-text');

      // Construir o menu
      CATEGORIES.forEach((cat, index) => {
        const item = document.createElement('div');
        item.className = `dropdown-item ${index === 0 ? 'selected' : ''}`;
        item.innerHTML = `
          <span>${cat}</span>
          <svg class="check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
        `;
        item.onclick = () => {
          document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          text.innerText = cat;
          currentCategory = cat;
          menu.classList.remove('open');
          render();
        };
        menu.appendChild(item);
        
        // Adicionar separador após o primeiro item (Todas as categorias)
        if (index === 0) {
          const sep = document.createElement('div');
          sep.className = 'dropdown-separator';
          menu.appendChild(sep);
        }
      });

      // Abrir/Fechar menu
      trigger.onclick = (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
      };

      // Fechar ao clicar fora
      document.addEventListener('click', (e) => {
        if (!trigger.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('open');
        }
      });
    }

    function setupEvents() {
      document.getElementById('search-input').addEventListener('input', render);
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentTab = e.target.dataset.tab;
          render();
        };
      });
    }

    function render() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('content-area');
      container.innerHTML = '';

      // Filtrar
      let filtered = ITEMS.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        if (!matchesSearch) return false;
        
        // Filtro por Categoria
        if (currentCategory !== 'Todas as categorias' && item.category !== currentCategory) return false;

        // Filtro por Aba
        if (currentTab === 'all') return item.type === 'plugin';
        if (currentTab === 'skill') return item.type === 'skill';
        if (currentTab === 'installed') return enabledItems[item.id] === true;
        return true; 
      });

      // Agrupar
      const grouped = {};
      filtered.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });

      if (Object.keys(grouped).length === 0) {
        container.innerHTML = '<p style="color: var(--muted); margin-top: 20px;">Nenhum item encontrado nesta categoria.</p>';
        return;
      }

      // Renderizar
      for (const cat in grouped) {
        const catSection = document.createElement('div');
        catSection.className = 'category';
        catSection.innerHTML = `
          <div class="category-header"><h2 class="category-title">${cat}</h2></div>
          <div class="grid"></div>
        `;
        container.appendChild(catSection);
        
        const grid = catSection.querySelector('.grid');
        grouped[cat].forEach(item => {
          const isEnabled = enabledItems[item.id] === true;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="icon-box">${item.icon}</div>
            <div class="card-content">
              <div class="card-title">${item.name}</div>
              <div class="card-desc">${item.desc}</div>
            </div>
            <button class="btn-add ${isEnabled ? 'installed' : ''}" id="btn-${item.id}">
              ${isEnabled ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'}
            </button>
          `;
          grid.appendChild(card);

          document.getElementById(`btn-${item.id}`).onclick = async (e) => {
            const btn = e.currentTarget;
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;
            await window.kortex.plugins.toggle(item.id, !isEnabled);
            enabledItems[item.id] = !isEnabled;
            setTimeout(() => {
              btn.innerHTML = !isEnabled ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
              btn.classList.toggle('installed');
              btn.disabled = false;
            }, 300);
          };
        });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
