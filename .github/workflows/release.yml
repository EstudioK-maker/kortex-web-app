name: Release Kortex

# Compila o Kortex Browser em Windows nativo e publica o Release no GitHub
# (instalador NSIS + latest.yml + blockmap — igual ao processo manual anterior).
# Disparar: Actions -> Release Kortex -> Run workflow (ou via API: workflow_dispatch)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar release (true) ou só compilar (false)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências (inclui electron castlabs + electron-builder)
        run: npm install --include=dev --no-audit --no-fund
        shell: pwsh

      - name: Compilar e publicar (electron-builder)
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
        shell: pwsh

      - name: Compilar sem publicar (modo de teste)
        if: ${{ github.event.inputs.publish == 'false' }}
        run: npx electron-builder --win --publish never
        shell: pwsh

      - name: Artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kortex-dist
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
