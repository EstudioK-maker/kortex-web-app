<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Kortex Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="setup-body">
  <div class="setup-container">
    <div class="setup-card">
      <div class="setup-header">
        <div class="setup-logo"><svg viewBox="0 0 32 32"><path d="M9 6v20M9 16l12-10M12.5 14l9.5 12"/></svg></div>
        <h1>Bem-vindo ao Kortex</h1>
        <p>Vamos configurar o seu navegador.</p>
      </div>

      <div class="setup-step active" id="step-1">
        <label>Como você quer ser chamado?</label>
        <input type="text" id="browser-name" value="Kanha" placeholder="Seu nome">
        <button class="btn-primary" onclick="nextStep(2)">Continuar →</button>
      </div>

      <div class="setup-step" id="step-2">
        <label>Escolha o seu tema:</label>
        <div class="theme-grid">
          <div class="theme-option active" data-theme="dark" onclick="selectTheme('dark', this)"><div class="theme-preview dark-preview"></div><span>Dark Mode</span></div>
          <div class="theme-option" data-theme="light" onclick="selectTheme('light', this)"><div class="theme-preview light-preview"></div><span>Claro</span></div>
        </div>
        <button class="btn-primary" onclick="nextStep(3)">Continuar →</button>
      </div>

      <div class="setup-step" id="step-3">
        <label>Importar dados de outros navegadores</label>
        <p style="font-size: 12px; color: #888; margin-bottom: 10px;">Vamos importar automaticamente seu histórico e favoritos.</p>
        <div id="detected-browsers" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
          <p style="color: #555;">Procurando...</p>
        </div>
        <button class="btn-primary" onclick="nextStep(4)">Continuar →</button>
      </div>

      <div class="setup-step" id="step-4">
        <label>Sincronize sua conta</label>
        <p style="font-size: 12px; color: #888; margin-bottom: 10px;">Faça login para salvar tudo na nuvem e acessar de qualquer lugar.</p>
        <button class="btn-google" onclick="finishSetup()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Fazer login com o Google
        </button>
        <button class="btn-primary" style="background: transparent; border: 1px solid var(--border-strong); margin-top: 10px;" onclick="finishSetup()">Pular por enquanto</button>
      </div>
    </div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
