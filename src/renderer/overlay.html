<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { background: transparent; overflow: hidden; height: 100vh; width: 100vw; pointer-events: none; }
    
    #browser-menu {
      position: absolute; display: none; flex-direction: column; width: 240px;
      background: #202124; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6); padding: 6px; pointer-events: auto;
      animation: menu-in 0.15s ease; transform-origin: top right;
    }
    @keyframes menu-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    #browser-menu.is-open { display: flex; }
    
    .menu-item {
      display: flex; align-items: center; gap: 12px; height: 36px;
      padding: 0 10px; border-radius: 6px; font-size: 13.5px; color: #ececee;
      cursor: pointer; transition: background 0.1s;
    }
    .menu-item:hover { background: rgba(255,255,255,0.08); }
    .menu-item svg { width: 17px; height: 17px; fill: none; stroke: #9a9aa2; stroke-width: 1.5; }
    .menu-item--danger { color: #ff6b62; }
    .menu-item--danger svg { stroke: #ff6b62; }
    .menu-item--danger:hover { background: rgba(229,52,43,0.14); }
    
    .menu-separator { height: 1px; background: rgba(255,255,255,0.08); margin: 6px 4px; }
    
    .user-header {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 6px;
    }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ff5722; color: #fff; display: grid; place-items: center; font-weight: bold; font-size: 14px; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 14px; font-weight: 600; color: #fff; }
    .user-sub { font-size: 12px; color: #9a9aa2; }
  </style>
</head>
<body>
  <div id="browser-menu">
    <div class="user-header">
      <div class="avatar" id="menu-avatar">K</div>
      <div class="user-info">
        <span class="user-name" id="menu-name">knive</span>
        <span class="user-sub">Sessão Local</span>
      </div>
    </div>
    
    <div class="menu-item" data-action="open-bookmarks">
      <svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>
      <span>Marcadores</span>
    </div>
    <div class="menu-item" data-action="open-history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Histórico</span>
    </div>
    <div class="menu-item" data-action="open-downloads">
      <svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      <span>Transferências</span>
    </div>
    <div class="menu-item" data-action="open-extensions">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/></svg>
      <span>Extensões</span>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="open-settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Definições</span>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-item menu-item--danger" data-action="quit">
      <svg viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M15 8l4 4-4 4M19 12H9"/></svg>
      <span>Sair do Kortex</span>
    </div>
  </div>
  <script src="js/overlay.js"></script>
</body>
</html>
