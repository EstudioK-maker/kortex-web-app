<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Kortex</title>
<style>
:root { --bg:#1a1b1d; --surface:#232427; --hover:#2b2c30; --border:#2c2d31; --text:#ececee; --muted:#9a9aa2; --accent:#ff5722; --danger:#ff6b62; }
@media (prefers-color-scheme: light) { :root { --bg:#fff; --surface:#f3f4f6; --hover:#e7e9ed; --border:#dcdee3; --text:#1b1c1f; --muted:#5b5d66; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 14px; }
header { display: flex; align-items: center; gap: 16px; padding: 16px 28px; border-bottom: 1px solid var(--border); }
h1 { font-size: 20px; font-weight: 600; min-width: 150px; }
nav { display: flex; gap: 4px; }
nav a { padding: 7px 14px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13px; }
nav a:hover { background: var(--hover); color: var(--text); }
nav a.on { background: var(--surface); color: var(--accent); }
#search { margin-left: auto; width: 280px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; font-size: 13px; }
#clear { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,107,98,.4); color: var(--danger); background: transparent; cursor: pointer; font-size: 13px; }
#clear:hover { background: rgba(255,107,98,.1); }
main { flex: 1; overflow-y: auto; padding: 8px 28px 40px; }
.day { margin: 22px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: capitalize; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; }
.row:hover { background: var(--surface); }
.time { width: 44px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
.ico { width: 26px; height: 26px; border-radius: 50%; background: var(--hover); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.info { flex: 1; min-width: 0; }
.info a, .info .t { display: block; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info a:hover { color: var(--accent); }
.info small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.x, .btn { border-radius: 6px; padding: 5px 10px; color: var(--muted); background: transparent; border: 1px solid var(--border); cursor: pointer; font-size: 12px; }
.x { border: 0; font-size: 16px; padding: 2px 8px; }
.x:hover, .btn:hover { background: var(--hover); color: var(--text); }
.bar { height: 4px; border-radius: 2px; background: var(--hover); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.folder-btn { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-input { width: 150px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--text); outline: none; font-size: 12px; }
.fold { margin: 22px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.fold b { font-weight: 600; color: var(--text); }
.fold span { font-weight: 400; font-size: 12px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<datalist id="folders"></datalist>
<header>
  <h1 id="title"></h1>
  <nav>
    <a href="kortex://history" data-v="history">Histórico</a>
    <a href="kortex://bookmarks" data-v="bookmarks">Marcadores</a>
    <a href="kortex://downloads" data-v="downloads">Transferências</a>
  </nav>
  <input id="search" placeholder="Pesquisar" autocomplete="off">
  <button id="clear"></button>
</header>
<main id="list"></main>

<script>
const K = window.kortex;
// A vista vem SEMPRE do endereço: kortex://history | kortex://bookmarks | kortex://downloads.
// O main.js serve esta mesma página para os três anfitriões; os links do menu abaixo navegam entre eles.
const VIEWS = ['history', 'bookmarks', 'downloads'];
const view = VIEWS.includes(location.hostname) ? location.hostname : 'history';
const TITLES = { history: 'Histórico', bookmarks: 'Marcadores', downloads: 'Transferências' };
const $ = (s) => document.querySelector(s);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const q = () => $('#search').value.trim().toLowerCase();
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b > 1024 ? (b / 1024).toFixed(0) + ' KB' : (b || 0) + ' B';

$('#title').textContent = TITLES[view] || 'Kortex';
document.title = (TITLES[view] || 'Kortex') + ' - Kortex';
document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.v === view));
$('#clear').textContent = view === 'history' ? 'Limpar histórico' : view === 'downloads' ? 'Limpar lista' : '';
if (!$('#clear').textContent) $('#clear').style.display = 'none';

function linkRow(item, onDelete, timeText, extra) {
  const row = h('div', 'row');
  if (timeText) row.append(h('span', 'time', timeText));
  row.append(h('span', 'ico', (hostOf(item.url)[0] || '?').toUpperCase()));
  const info = h('div', 'info');
  const a = h('a', '', item.title || item.url);
  a.href = item.url;
  info.append(a, h('small', '', item.url));
  const del = h('button', 'x', '×');
  del.title = 'Remover';
  del.onclick = onDelete;
  row.append(info);
  if (extra) row.append(extra);
  row.append(del);
  return row;
}

async function renderHistory() {
  const list = $('#list'); list.replaceChildren();
  const all = ((await K.history.get()) || []).filter((i) => !q() || (i.title || '').toLowerCase().includes(q()) || i.url.toLowerCase().includes(q()));
  if (!all.length) return list.append(h('div', 'empty', 'Sem resultados.'));
  let lastDay = '';
  all.forEach((i) => {
    const d = new Date(i.date);
    const day = d.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    if (day !== lastDay) { list.append(h('div', 'day', day)); lastDay = day; }
    list.append(linkRow(i, async () => { await K.history.remove(i.url); renderHistory(); }, d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' })));
  });
}

// Botão "Pasta": mostra a pasta atual e, ao carregar, vira um campo com as pastas existentes (Enter guarda, Esc cancela, vazio = sem pasta).
function folderControl(b) {
  const btn = h('button', 'btn folder-btn', b.folder ? '📁 ' + b.folder : '＋ Pasta');
  btn.title = 'Mudar de pasta';
  btn.onclick = () => {
    const input = h('input', 'folder-input');
    input.setAttribute('list', 'folders');
    input.placeholder = 'Nome da pasta';
    input.value = b.folder || '';
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      if (save) await K.bookmarks.setFolder(b.id, input.value);
      renderBookmarks();
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
    input.addEventListener('blur', () => finish(true));
    btn.replaceWith(input);
    input.focus(); input.select();
  };
  return btn;
}

async function renderBookmarks() {
  const list = $('#list'); list.replaceChildren();
  const every = (await K.bookmarks.list()) || [];
  const dl = $('#folders'); dl.replaceChildren();
  [...new Set(every.map((b) => b.folder).filter(Boolean))].sort().forEach((f) => { const o = document.createElement('option'); o.value = f; dl.append(o); });

  const all = every.filter((b) => !q() || (b.title || '').toLowerCase().includes(q()) || b.url.toLowerCase().includes(q()) || (b.folder || '').toLowerCase().includes(q()));
  if (!all.length) return list.append(h('div', 'empty', every.length ? 'Sem resultados.' : 'Ainda não tens marcadores. Carrega na estrela da barra de endereço.'));

  const groups = {};
  all.forEach((b) => { (groups[b.folder || ''] = groups[b.folder || ''] || []).push(b); });
  const names = Object.keys(groups).sort((x, y) => (x === '' ? 1 : y === '' ? -1 : x.localeCompare(y, 'pt')));
  const showHeads = names.length > 1 || names[0] !== '';
  names.forEach((name) => {
    if (showHeads) {
      const head = h('div', 'fold'); head.append(h('b', '', name ? '📁 ' + name : 'Sem pasta'), h('span', '', groups[name].length + (groups[name].length === 1 ? ' marcador' : ' marcadores')));
      list.append(head);
    }
    groups[name].forEach((b) => list.append(linkRow(b, async () => { await K.bookmarks.remove(b.id); renderBookmarks(); }, null, folderControl(b))));
  });
}

async function renderDownloads() {
  const list = $('#list'); list.replaceChildren();
  const all = ((await K.downloads.list()) || []).filter((d) => !q() || d.name.toLowerCase().includes(q()));
  if (!all.length) return list.append(h('div', 'empty', 'Sem transferências.'));
  all.forEach((d) => {
    const row = h('div', 'row');
    row.append(h('span', 'ico', '↓'));
    const info = h('div', 'info');
    info.append(h('span', 't', d.name));
    const pct = d.total > 0 ? Math.round(d.received / d.total * 100) + '% · ' : '';
    const states = { completed: 'Concluído', cancelled: 'Cancelado', interrupted: 'Interrompido', paused: 'Em pausa · ' + pct + fmt(d.received) + ' / ' + fmt(d.total), progressing: pct + fmt(d.received) + ' / ' + fmt(d.total) };
    info.append(h('small', '', (states[d.state] || d.state) + ' · ' + hostOf(d.url)));
    if ((d.state === 'progressing' || d.state === 'paused') && d.total > 0) {
      const bar = h('div', 'bar'); const fill = h('i'); fill.style.width = Math.min(100, d.received / d.total * 100) + '%'; bar.append(fill); info.append(bar);
    }
    row.append(info);
    if (d.state === 'completed') {
      const o = h('button', 'btn', 'Abrir'); o.onclick = () => K.downloads.open(d.id);
      const s = h('button', 'btn', 'Mostrar na pasta'); s.onclick = () => K.downloads.show(d.id);
      row.append(o, s);
    } else if (d.state === 'progressing' || d.state === 'paused') {
      const pr = h('button', 'btn', d.state === 'paused' ? 'Retomar' : 'Pausar');
      pr.onclick = async () => { await (d.state === 'paused' ? K.downloads.resume(d.id) : K.downloads.pause(d.id)); render(); };
      const c = h('button', 'btn', 'Cancelar'); c.onclick = async () => { await K.downloads.cancel(d.id); render(); };
      row.append(pr, c);
    }
    list.append(row);
  });
}

const render = () => ({ history: renderHistory, bookmarks: renderBookmarks, downloads: renderDownloads }[view] || renderHistory)();
$('#search').addEventListener('input', render);
$('#clear').addEventListener('click', async () => {
  if (view === 'history' && confirm('Apagar todo o histórico?')) { await K.history.clear(); render(); }
  if (view === 'downloads') { await K.downloads.clear(); render(); }
});
render();
if (view === 'downloads') setInterval(() => { if (document.activeElement !== $('#search')) render(); }, 1000);
</script>
</body>
</html>
