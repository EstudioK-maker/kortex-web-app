<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #0f1011; color: #fff; font-family: "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; user-select: none; -webkit-app-region: drag; }
    .box { text-align: center; padding: 40px; background: #1a1b1d; border: 1px solid #2c2d31; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); width: 380px; }
    svg { width: 48px; height: 48px; stroke: #ff5722; fill: none; stroke-width: 2; margin-bottom: 20px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px 0; font-size: 20px; font-weight: 600; }
    p { color: #888; font-size: 13px; margin: 0 0 24px 0; line-height: 1.5; }
    .progress-bar { width: 100%; height: 6px; background: #2c2d31; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { height: 100%; background: #ff5722; width: 0%; transition: width 0.3s; }
    .percent { font-size: 12px; font-weight: bold; color: #ff5722; }
  </style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <h2>A atualizar o Kortex...</h2>
    <p>Estamos a instalar a versão mais recente.<br>Por favor, aguarda.</p>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <span class="percent" id="text">0%</span>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('update-progress', (event, percent) => {
      document.getElementById('fill').style.width = percent + '%';
      document.getElementById('text').innerText = Math.round(percent) + '%';
    });
  </script>
</body>
</html>
